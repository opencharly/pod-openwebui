openwebui:
    candy:
        description: |
            Open WebUI LLM chat front-end with an auto-configuring entrypoint, served as a supervised HTTP service on port 8080.
            Installs the Open WebUI server (the `open-webui` PyPI package via pixi)
            and copies a bash auto-config entrypoint to
            ${HOME}/.local/bin/openwebui-entrypoint (mode 0755). A supervised system
            service runs that entrypoint, which wires up LLM providers from
            env/secrets (OpenRouter, Ollama Cloud, direct OpenAI, local Ollama, MCP
            servers, and Jupyter code execution), enforces mandatory admin
            credentials (WEBUI_ADMIN_EMAIL + WEBUI_ADMIN_PASSWORD), reads the
            auto-generated WEBUI_SECRET_KEY, then exec's `open-webui serve` on port
            8080. Every fact below is observable: the installed executable
            entrypoint, the running service, the admin email injected into its
            environment, and the HTTP 200 the web UI returns on its published port.
        require:
            - '@github.com/opencharly/layer-python:v2026.293.1922'
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
            # pydub is a hard dependency of open-webui and needs the ffmpeg BINARY:
            # Open Web UI transcodes any non-MP3 speech response through it, and an
            # absent binary turns a WAV reply into a 500. Measured on the deployed
            # pod: pydub present, ffmpeg missing.
            - '@github.com/opencharly/layer-ffmpeg:v2026.272.0056'
        env:
            DATA_DIR: "/opt/data"
            PORT: "8080"
            DOCKER: "true"
            ENABLE_DIRECT_CONNECTIONS: "true"
            ENABLE_CODE_EXECUTION: "true"
            ENABLE_PERSISTENT_CONFIG: "false"
            ENABLE_VERSION_UPDATE_CHECK: "false"
            # Image generation speaks to a ComfyUI server through this engine. The ENGINE is a
            # constant of the wiring; the SERVER URL is per deploy (see COMFYUI_BASE_URL below),
            # and generation stays off until an operator turns it on with
            # ENABLE_IMAGE_GENERATION=true — see the two accepts below.
            IMAGE_GENERATION_ENGINE: comfyui
        env_require:
            - name: WEBUI_ADMIN_EMAIL
              description: "Admin account email (identifier, not a credential) — pass via: charly config openwebui -e WEBUI_ADMIN_EMAIL=you@example.com"
        env_accept:
            # --- Image generation (ComfyUI) -------------------------------------------------
            # A ComfyUI deploy can inject COMFYUI_BASE_URL itself through env_provide, so the
            # common case is: deploy comfyui, then point this deploy at it by name.
            - name: COMFYUI_BASE_URL
              description: "ComfyUI server base URL, e.g. http://charly-comfyui-lab:8188 (a comfyui deploy can provide it). Setting it together with ENABLE_IMAGE_GENERATION=true turns on Open WebUI's ComfyUI image generation."
            - name: ENABLE_IMAGE_GENERATION
              description: "Turn on image generation (set to true once COMFYUI_BASE_URL is present). Off by default so an unrelated deploy does not advertise a feature whose server is absent."
            - name: IMAGE_GENERATION_ENGINE
              description: "Engine word for image generation (default: comfyui, baked into the image). Pass it explicitly when deploying an image built BEFORE this contract, which carries no default."
            - name: COMFYUI_WORKFLOW_NODES
              description: "JSON map of the workflow nodes that carry prompt/negative_prompt/width/height/batch size/steps/seed. Optional — leave unset to use Open WebUI's built-in default workflow node ids."
            - name: OLLAMA_HOST
              description: "Local Ollama server URL (auto-injected by ollama layer env_provides)"
            - name: OPENAI_API_BASE_URL
              description: "OpenAI-compatible API base URL"
            - name: WEBUI_AUTH
              description: "Enable authentication (default: true)"
            - name: CHARLY_MCP_SERVERS
              description: "JSON array of MCP servers (auto-injected by mcp_provide layers)"
            # The entrypoint forwards this to BOTH CODE_EXECUTION_* and CODE_INTERPRETER_*
            # when a jupyter MCP server is detected, but nothing could provide it: no
            # env_accept existed, so an authenticated Jupyter needed `charly config -e`.
            - name: CODE_EXECUTION_JUPYTER_AUTH_TOKEN
              description: "Jupyter auth token for the code-execution engine (auto-injected by a jupyter candy env_provide)"
            # Speech synthesis. A provider candy declares QWEN3_TTS_HOST (an
            # OpenAI-compatible base URL ending in /v1); the entrypoint turns it
            # into Open WebUI's AUDIO_TTS_* pair. Without this declaration the
            # provide is filtered out and no amount of --update-all helps.
            - name: QWEN3_TTS_HOST
              description: "OpenAI-compatible speech (TTS) base URL, e.g. http://charly-qwen3-tts:8000/v1 (auto-injected by a qwen3-tts candy env_provide)"
            - name: QWEN3_TTS_SERVED_MODEL
              description: "Model id the speech server answers for (auto-injected; Open WebUI forces it into every speech request)"
            - name: QWEN3_TTS_VOICE
              description: "Default voice id for speech synthesis (auto-injected; must exist on the speech server)"
            # The entrypoint reads this one, so it MUST be declared here: an undeclared
            # provide is filtered out by `charly config --update-all` and the key would
            # silently never arrive.
            - name: QWEN3_TTS_API_KEY
              description: "Bearer key the speech server expects (auto-injected; optional — a keyless server needs none)"
            # Speech-to-text. WHISPER_BASE_URL is auto-injected by the whisper candy's
            # env_provide; WHISPER_MODEL rides along so AUDIO_STT_MODEL can name the
            # checkpoint the server actually serves. NOTE the deliberate name overlap:
            # Open Web UI's LOCAL-lane model var is also called WHISPER_MODEL, but only one
            # engine is live at a time (AUDIO_STT_ENGINE is a single value), so the meaning
            # coincides and a second name would be two names for one thing.
            - name: WHISPER_BASE_URL
              description: "Whisper ASR server base URL ending in /v1 (auto-injected by the whisper layer env_provide)"
            - name: WHISPER_MODEL
              description: "Checkpoint the whisper server serves; forwarded to Open Web UI as AUDIO_STT_MODEL"
            # RAG vector store. QDRANT_URL is the name the qdrant layer PROVIDES
            # (layer-qdrant's env_provide); provides are name-matched, so this entry must
            # carry the PROVIDER's name — the entrypoint maps it onto Open WebUI's native
            # QDRANT_URI. Declaring QDRANT_URI here would inject nothing at all.
            - name: QDRANT_URL
              description: "Qdrant REST endpoint, e.g. http://charly-qdrant:6333 (auto-injected by the qdrant layer env_provide); present + a QDRANT_API_KEY turns the RAG vector store into Qdrant"
            # Optional pass-throughs, upstream names verbatim — no renaming layer. Each is
            # read by Open WebUI's config.py as a plain os.getenv (not PersistentConfig),
            # so env is the only way to set them and the admin panel cannot persist any.
            - name: QDRANT_ON_DISK
              description: "Store Qdrant collections on disk (upstream QDRANT_ON_DISK, default false)"
            - name: QDRANT_COLLECTION_PREFIX
              description: "Prefix for the multi-tenant collections (upstream default 'open-webui')"
            - name: QDRANT_PREFER_GRPC
              description: "Use gRPC instead of REST for Qdrant (upstream QDRANT_PREFER_GRPC, default false)"
            - name: QDRANT_GRPC_PORT
              description: "Qdrant gRPC port when QDRANT_PREFER_GRPC is set (upstream default 6334)"
            - name: ENABLE_QDRANT_MULTITENANCY_MODE
              description: "Qdrant multi-tenancy mode (upstream default true — tenanted open-webui_* collections)"
            - name: QDRANT_TIMEOUT
              description: "Qdrant client timeout in seconds (upstream default 5)"

        # Credential-store-backed env vars. Values live in the user's credential
        # backend (keyring/config) and are injected at runtime via podman
        # secrets (Secret=<name>,type=env,target=<var>). Never land in deploy.yml
        # or the quadlet file as plaintext. See /charly-build:secrets and /charly-image:layer.
        #
        # WEBUI_ADMIN_PASSWORD is REQUIRED. When the deploy runs with --password=auto it is
        # auto-generated as 32 random bytes in url-safe base64 (44 characters) by
        # deploykit.GenerateAndStoreSecret (sdk/deploykit/secret_provision.go) writing through
        # verb:credential; without that flag `charly config` stops on the missing-secret error and
        # the value must be stored first. Making the pod path generate unconditionally, as the
        # VM/host path already does, is opencharly/plugin-deploy-pod#62.
        # The credential key is HOST-GLOBAL today — every deployment of this candy (and every
        # `check-*` bed) writes the same one and the last writer wins; scoping it per deploy is
        # opencharly/pod-openwebui#19.
        #   charly secrets get charly/secret WEBUI_ADMIN_PASSWORD      # retrieve
        #   charly secrets set charly/secret WEBUI_ADMIN_PASSWORD <pw> # set before deploying
        secret_require:
            - name: WEBUI_ADMIN_PASSWORD
              description: "Initial admin account password for Open WebUI first-run setup. Generated as 32 random bytes in url-safe base64 (44 characters) when the deploy runs with --password=auto; without that flag it must be stored first (opencharly/plugin-deploy-pod#62). The credential key is host-global today — shared by every deployment of this candy, last writer wins (opencharly/pod-openwebui#19); retrieve with `charly secrets get charly/secret WEBUI_ADMIN_PASSWORD`."
        secret_accept:
            - name: OPENROUTER_API_KEY
              description: "API key for OpenRouter (maps to OPENAI_API_KEY with OpenRouter base URL)"
              key: charly/api-key/openrouter
            - name: OLLAMA_API_KEY
              description: "API key for Ollama Cloud inference"
              key: charly/api-key/ollama
            - name: OPENAI_API_KEY
              description: "Direct OpenAI API key (alone it is enough — the base URL defaults to https://api.openai.com/v1)"
              key: charly/api-key/openai
            - name: WHISPER_API_KEY
              description: "Bearer token for the whisper ASR server; the SAME credential the whisper candy reads, so both ends agree"
              key: charly/api-key/whisper
            # The qdrant admin key is the PROVIDER's credential, not a second copy: the qdrant
            # layer's secret_require generates it at charly/api-key/qdrant, and this accept
            # reads the same stored value (both ends agree, like the whisper key above).
            # Never an env_provide — that would write the key into the image's
            # ai.opencharly.env_provide OCI label in cleartext.
            - name: QDRANT_API_KEY
              description: "Qdrant admin API key (the key the qdrant layer generates and stores at charly/api-key/qdrant); required whenever QDRANT_URL is present"
              key: charly/api-key/qdrant

        mcp_accept:
            - name: jupyter
              description: "JupyterLab CRDT MCP server for notebook manipulation"
            - name: chrome-devtools
              description: "Chrome DevTools MCP server for browser automation"
        port:
            - 8080
        volume:
            - name: data
              path: "/opt/data"
        alias:
            - name: open-webui
              command: open-webui
        secret:
            - name: webui-secret-key
              env: WEBUI_SECRET_KEY
        service:
            - name: openwebui
              exec: "%(ENV_HOME)s/.local/bin/openwebui-entrypoint"
              restart: always
              working_directory: "%(ENV_HOME)s"
              enable: true
              scope: system
        plan:
            - run: mkdir=${HOME}/.local/bin
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: copy=openwebui-entrypoint
              copy: openwebui-entrypoint
              to: "${HOME}/.local/bin/openwebui-entrypoint"
              mode: "0755"
              run_as: "${USER}"
            - check: the auto-config entrypoint script is present and executable at ${HOME}/.local/bin/openwebui-entrypoint
              file:
                file: ${HOME}/.local/bin/openwebui-entrypoint
                exists: true
                mode: "0755"
            - check: the openwebui service is running under the init system
              context:
                - runtime
              service:
                service: openwebui
                running: true
            - check: the Open WebUI web interface answers HTTP 200 on the published port
              timeout: 30s
              # First start is not quick: Open WebUI runs its Alembic migrations and
              # builds the model cache before uvicorn binds, so a single unconditional
              # GET on a fresh deployment hits the port forwarder with nothing behind it
              # and gets a connection reset (measured: the whole live phase failed on
              # this step at ~8s into a cold bed). `eventually` probes readiness in the
              # engine — a bounded retry, never a fixed sleep — for the app's real
              # cold-start budget; steady state is still asserted by the same single
              # request once it is up.
              eventually: 3m
              retry_interval: 2s
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:8080}/
                status: 200
            # The entrypoint's provider projection has no other committed witness, so it is
            # asserted HERE as a BUILD-scope check: the stub `open-webui` below stands in for
            # the real service and captures what the entrypoint WOULD exec, which is the
            # projection under test. Build scope is deliberate — `check live` resolves the
            # PUBLISHED candy, so a runtime-scoped step here would be skipped in both phases;
            # `check image` runs the candy this tree actually built, and fails without the
            # key-alone fix (measured: the same input produced no provider before it — at
            # build time there is no OPENAI_API_KEY in the environment at all, so the key is
            # SET explicitly in case A and explicitly ABSENT in case C).
            - check: the entrypoint configures a provider from OPENAI_API_KEY alone, defaulting the base URL to the upstream endpoint — the declared secret must work without a second variable
              id: entrypoint-openai-key-alone
              exit_status: 0
              stdout:
                - contains: "OpenAI-compatible at https://api.openai.com/v1"
                - contains: "PROJECTED=https://api.openai.com/v1"
              command: |
                mkdir -p /tmp/ep-stub
                printf '#!/bin/sh\nif [ -z "$OPENAI_API_BASE_URLS" ]; then echo "PROJECTED=none"; else echo "PROJECTED=$OPENAI_API_BASE_URLS"; fi\n' > /tmp/ep-stub/open-webui
                chmod 0755 /tmp/ep-stub/open-webui
                env -u OPENAI_API_BASE_URL -u OPENROUTER_API_KEY -u OLLAMA_API_KEY -u OLLAMA_HOST -u CHARLY_MCP_SERVERS -u CODE_EXECUTION_JUPYTER_AUTH_TOKEN OPENAI_API_KEY=probe-key PATH=/tmp/ep-stub:/usr/local/bin:/usr/bin:/bin DATA_DIR=/tmp/ep-data WEBUI_ADMIN_EMAIL=probe@example.com WEBUI_ADMIN_PASSWORD=probe ~/.local/bin/openwebui-entrypoint
            - check: with no provider variables set the entrypoint invents no provider
              id: entrypoint-openai-absent
              exit_status: 0
              stdout:
                - contains: "PROJECTED=none"
              command: |
                mkdir -p /tmp/ep-stub
                printf '#!/bin/sh\nif [ -z "$OPENAI_API_BASE_URLS" ]; then echo "PROJECTED=none"; else echo "PROJECTED=$OPENAI_API_BASE_URLS"; fi\n' > /tmp/ep-stub/open-webui
                chmod 0755 /tmp/ep-stub/open-webui
                env -u OPENAI_API_KEY -u OPENAI_API_BASE_URL -u OPENROUTER_API_KEY -u OLLAMA_API_KEY -u OLLAMA_HOST -u CHARLY_MCP_SERVERS -u CODE_EXECUTION_JUPYTER_AUTH_TOKEN PATH=/tmp/ep-stub:/usr/local/bin:/usr/bin:/bin DATA_DIR=/tmp/ep-data WEBUI_ADMIN_EMAIL=probe@example.com WEBUI_ADMIN_PASSWORD=probe ~/.local/bin/openwebui-entrypoint
            # The STT projection has no other committed witness, so both arms are asserted
            # HERE as BUILD-scope checks against a stub `open-webui` that echoes what the
            # entrypoint WOULD exec (the same shape as entrypoint-openai-key-alone above).
            # Bare $VAR names inside the stub body, never ${VAR}: the check runner scans a
            # step's body for unresolvable upper-case ${...} tokens and SKIPS the step.
            - check: with a whisper server provided the entrypoint projects the remote STT engine
              id: entrypoint-whisper-present
              exit_status: 0
              stdout:
                - contains: "STT_ENGINE=openai"
                - contains: "STT_BASE=http://charly-whisper:9000/v1"
                - contains: "STT_MODEL=base"
                - contains: "STT_KEY=probe-whisper-key"
              command: |
                mkdir -p /tmp/ep-stub
                printf '#!/bin/sh\necho "STT_ENGINE=$AUDIO_STT_ENGINE"\necho "STT_BASE=$AUDIO_STT_OPENAI_API_BASE_URL"\necho "STT_MODEL=$AUDIO_STT_MODEL"\necho "STT_KEY=$AUDIO_STT_OPENAI_API_KEY"\n' > /tmp/ep-stub/open-webui
                chmod 0755 /tmp/ep-stub/open-webui
                env -u OPENAI_API_KEY -u OPENAI_API_BASE_URL -u OPENROUTER_API_KEY -u OLLAMA_API_KEY -u OLLAMA_HOST -u CHARLY_MCP_SERVERS -u CODE_EXECUTION_JUPYTER_AUTH_TOKEN -u AUDIO_STT_ENGINE -u AUDIO_STT_OPENAI_API_BASE_URL -u AUDIO_STT_MODEL -u AUDIO_STT_OPENAI_API_KEY WHISPER_BASE_URL=http://charly-whisper:9000/v1 WHISPER_MODEL=base WHISPER_API_KEY=probe-whisper-key PATH=/tmp/ep-stub:/usr/local/bin:/usr/bin:/bin DATA_DIR=/tmp/ep-data WEBUI_ADMIN_EMAIL=probe@example.com WEBUI_ADMIN_PASSWORD=probe ~/.local/bin/openwebui-entrypoint
            - check: with no whisper server the entrypoint claims no remote STT engine
              id: entrypoint-whisper-absent
              exit_status: 0
              stdout:
                - contains: "STT_ENGINE="
                - contains: "STT_KEY="
              command: |
                mkdir -p /tmp/ep-stub
                printf '#!/bin/sh\necho "STT_ENGINE=$AUDIO_STT_ENGINE"\necho "STT_KEY=$AUDIO_STT_OPENAI_API_KEY"\n' > /tmp/ep-stub/open-webui
                chmod 0755 /tmp/ep-stub/open-webui
                env -u OPENAI_API_KEY -u OPENAI_API_BASE_URL -u OPENROUTER_API_KEY -u OLLAMA_API_KEY -u OLLAMA_HOST -u CHARLY_MCP_SERVERS -u CODE_EXECUTION_JUPYTER_AUTH_TOKEN -u AUDIO_STT_ENGINE -u AUDIO_STT_OPENAI_API_BASE_URL -u AUDIO_STT_MODEL -u AUDIO_STT_OPENAI_API_KEY -u WHISPER_BASE_URL -u WHISPER_MODEL PATH=/tmp/ep-stub:/usr/local/bin:/usr/bin:/bin DATA_DIR=/tmp/ep-data WEBUI_ADMIN_EMAIL=probe@example.com WEBUI_ADMIN_PASSWORD=probe ~/.local/bin/openwebui-entrypoint
            # The vector-store projection has no other committed witness, so all three arms are
            # asserted HERE as BUILD-scope checks against the same stub (bare $VAR names, never
            # ${VAR} — an unresolvable upper-case token makes the runner SKIP the step).
            - check: the entrypoint switches the RAG vector store to Qdrant when QDRANT_URL is provided, mapping the qdrant layer's provided name onto the QDRANT_URI upstream actually reads
              id: entrypoint-qdrant-wired
              exit_status: 0
              stdout:
                - contains: "VECTORSTORE=qdrant"
                - contains: "PROJECTED=http://localhost:6333"
              command: |
                mkdir -p /tmp/ep-stub
                printf '#!/bin/sh\nif [ -z "$QDRANT_URI" ]; then echo "VECTORSTORE=none"; else echo "VECTORSTORE=$VECTOR_DB"; echo "PROJECTED=$QDRANT_URI"; fi\n' > /tmp/ep-stub/open-webui
                chmod 0755 /tmp/ep-stub/open-webui
                env -u OPENROUTER_API_KEY -u OLLAMA_API_KEY -u OLLAMA_HOST -u OPENAI_API_KEY -u OPENAI_API_BASE_URL -u CHARLY_MCP_SERVERS -u CODE_EXECUTION_JUPYTER_AUTH_TOKEN -u WHISPER_BASE_URL -u WHISPER_MODEL -u WHISPER_API_KEY QDRANT_URL=http://localhost:6333 QDRANT_API_KEY=probe-key PATH=/tmp/ep-stub:/usr/local/bin:/usr/bin:/bin DATA_DIR=/tmp/ep-data WEBUI_ADMIN_EMAIL=probe@example.com WEBUI_ADMIN_PASSWORD=probe ~/.local/bin/openwebui-entrypoint
            - check: with no qdrant variables the entrypoint invents no vector store and upstream keeps its Chroma default — an unconfigured deployment must not change behaviour
              id: entrypoint-qdrant-absent
              exit_status: 0
              stdout:
                - contains: "VECTORSTORE=none"
              command: |
                mkdir -p /tmp/ep-stub
                printf '#!/bin/sh\nif [ -z "$QDRANT_URI" ]; then echo "VECTORSTORE=none"; else echo "VECTORSTORE=$VECTOR_DB"; echo "PROJECTED=$QDRANT_URI"; fi\n' > /tmp/ep-stub/open-webui
                chmod 0755 /tmp/ep-stub/open-webui
                env -u OPENROUTER_API_KEY -u OLLAMA_API_KEY -u OLLAMA_HOST -u OPENAI_API_KEY -u OPENAI_API_BASE_URL -u CHARLY_MCP_SERVERS -u CODE_EXECUTION_JUPYTER_AUTH_TOKEN -u WHISPER_BASE_URL -u WHISPER_MODEL -u WHISPER_API_KEY -u QDRANT_URL -u QDRANT_API_KEY PATH=/tmp/ep-stub:/usr/local/bin:/usr/bin:/bin DATA_DIR=/tmp/ep-data WEBUI_ADMIN_EMAIL=probe@example.com WEBUI_ADMIN_PASSWORD=probe ~/.local/bin/openwebui-entrypoint
            - check: a QDRANT_URL with no resolvable QDRANT_API_KEY fails loud instead of falling back — an optional secret_accept that misses is otherwise SILENT, and a keyless Qdrant only fails later as a 401 behind a 503
              id: entrypoint-qdrant-key-missing
              exit_status: 1
              stdout:
                - contains: "QDRANT_API_KEY did not resolve"
              command: |
                mkdir -p /tmp/ep-stub
                printf '#!/bin/sh\nif [ -z "$QDRANT_URI" ]; then echo "VECTORSTORE=none"; else echo "VECTORSTORE=$VECTOR_DB"; echo "PROJECTED=$QDRANT_URI"; fi\n' > /tmp/ep-stub/open-webui
                chmod 0755 /tmp/ep-stub/open-webui
                env -u OPENROUTER_API_KEY -u OLLAMA_API_KEY -u OLLAMA_HOST -u OPENAI_API_KEY -u OPENAI_API_BASE_URL -u CHARLY_MCP_SERVERS -u CODE_EXECUTION_JUPYTER_AUTH_TOKEN -u WHISPER_BASE_URL -u WHISPER_MODEL -u WHISPER_API_KEY -u QDRANT_API_KEY QDRANT_URL=http://localhost:6333 PATH=/tmp/ep-stub:/usr/local/bin:/usr/bin:/bin DATA_DIR=/tmp/ep-data WEBUI_ADMIN_EMAIL=probe@example.com WEBUI_ADMIN_PASSWORD=probe ~/.local/bin/openwebui-entrypoint 2>&1
            - check: the mandatory admin email is injected into the running service environment
              exit_status: 0
              context:
                - runtime
              command: printenv WEBUI_ADMIN_EMAIL
            - agent-check: the rendered landing page presents the Open WebUI sign-in experience for the auto-provisioned admin account, ready to start an LLM chat
            - check: addr=127.0.0.1:${HOST_PORT:8080}
              id: openwebui-port
              timeout: 5s
              context:
                - runtime
              addr:
                addr: 127.0.0.1:${HOST_PORT:8080}
                reachable: true
            # Speech synthesis is a PAIR, and the pairing is the whole point:
            # AUDIO_TTS_OPENAI_API_BASE_URL defaults to OPENAI_API_BASE_URL — the
            # LLM server — so an engine set alone would POST speech requests at the
            # chat backend and surface as "Server Connection Error". This witness
            # proves the pair moves together, and that nothing is invented when no
            # provider is present. Build scope on purpose (no `context:`): `check
            # live` runs verify-only and would skip it.
            - check: the entrypoint projects the OpenAI TTS pair from the speech provide
              id: entrypoint-tts-projection
              exit_status: 0
              stdout:
                - contains: "TTS_ENGINE=xopenai"
                - contains: "TTS_BASE=xhttp://charly-qwen3-tts:8000/v1"
                - contains: 'TTS_PARAMS=x{"response_format":"mp3"}'
                - contains: "TTS_KEY=xnot-needed"
              command: |
                mkdir -p /tmp/tts-stub
                printf '#!/bin/sh\necho "TTS_ENGINE=x$AUDIO_TTS_ENGINE"\necho "TTS_BASE=x$AUDIO_TTS_OPENAI_API_BASE_URL"\necho "TTS_PARAMS=x$AUDIO_TTS_OPENAI_PARAMS"\necho "TTS_KEY=x$AUDIO_TTS_OPENAI_API_KEY"\n' > /tmp/tts-stub/open-webui
                chmod 0755 /tmp/tts-stub/open-webui
                env -u AUDIO_TTS_ENGINE -u AUDIO_TTS_OPENAI_API_BASE_URL -u AUDIO_TTS_OPENAI_API_KEY -u AUDIO_TTS_OPENAI_PARAMS -u AUDIO_TTS_MODEL -u AUDIO_TTS_VOICE QWEN3_TTS_HOST=http://charly-qwen3-tts:8000/v1 QWEN3_TTS_SERVED_MODEL=qwen3-tts QWEN3_TTS_VOICE=vivian PATH=/tmp/tts-stub:/usr/local/bin:/usr/bin:/bin DATA_DIR=/tmp/tts-data WEBUI_ADMIN_EMAIL=probe@example.com WEBUI_ADMIN_PASSWORD=probe ~/.local/bin/openwebui-entrypoint
            - check: with no speech provide the entrypoint invents no TTS engine
              id: entrypoint-tts-absent
              exit_status: 0
              stdout:
                - contains: "TTS_ENGINE=x"
                - not_contains: "xopenai"
              command: |
                mkdir -p /tmp/tts-stub
                printf '#!/bin/sh\necho "TTS_ENGINE=x$AUDIO_TTS_ENGINE"\necho "TTS_BASE=x$AUDIO_TTS_OPENAI_API_BASE_URL"\n' > /tmp/tts-stub/open-webui
                chmod 0755 /tmp/tts-stub/open-webui
