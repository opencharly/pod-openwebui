openwebui:
    candy:
        description: |
            Open WebUI LLM chat front-end with an auto-configuring entrypoint, served as a supervised HTTP service on port 8080.
            Installs the Open WebUI server (the `open-webui` PyPI package via pixi)
            and copies a bash auto-config entrypoint to
            ${HOME}/.local/bin/openwebui-entrypoint (mode 0755). A supervised system
            service runs that entrypoint, which wires up LLM providers from
            env/secrets (OpenRouter, Ollama Cloud, direct OpenAI, local Ollama, MCP
            servers, and Jupyter code execution), enforces mandatory admin
            credentials (WEBUI_ADMIN_EMAIL + WEBUI_ADMIN_PASSWORD), reads the
            auto-generated WEBUI_SECRET_KEY, then exec's `open-webui serve` on port
            8080. Every fact below is observable: the installed executable
            entrypoint, the running service, the admin email injected into its
            environment, and the HTTP 200 the web UI returns on its published port.
        require:
            - '@github.com/opencharly/layer-python:v2026.293.1922'
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
        env:
            DATA_DIR: "/opt/data"
            PORT: "8080"
            DOCKER: "true"
            ENABLE_DIRECT_CONNECTIONS: "true"
            ENABLE_CODE_EXECUTION: "true"
            ENABLE_PERSISTENT_CONFIG: "false"
            ENABLE_VERSION_UPDATE_CHECK: "false"
        env_require:
            - name: WEBUI_ADMIN_EMAIL
              description: "Admin account email (identifier, not a credential) — pass via: charly config openwebui -e WEBUI_ADMIN_EMAIL=you@example.com"
        env_accept:
            - name: OLLAMA_HOST
              description: "Local Ollama server URL (auto-injected by ollama layer env_provides)"
            - name: OPENAI_API_BASE_URL
              description: "OpenAI-compatible API base URL"
            - name: WEBUI_AUTH
              description: "Enable authentication (default: true)"
            - name: CHARLY_MCP_SERVERS
              description: "JSON array of MCP servers (auto-injected by mcp_provide layers)"
            # The entrypoint forwards this to BOTH CODE_EXECUTION_* and CODE_INTERPRETER_*
            # when a jupyter MCP server is detected, but nothing could provide it: no
            # env_accept existed, so an authenticated Jupyter needed `charly config -e`.
            - name: CODE_EXECUTION_JUPYTER_AUTH_TOKEN
              description: "Jupyter auth token for the code-execution engine (auto-injected by a jupyter candy env_provide)"

        # Credential-store-backed env vars. Values live in the user's credential
        # backend (keyring/config) and are injected at runtime via podman
        # secrets (Secret=<name>,type=env,target=<var>). Never land in deploy.yml
        # or the quadlet file as plaintext. See /charly-build:secrets and /charly-image:layer.
        #
        # WEBUI_ADMIN_PASSWORD: auto-generated on first deploy as a 32-byte hex
        # random value via DefaultCredentialStore.Set (see charly/layer_secrets.go
        # ensureLayerSecret). To use the auto-generated password to log in for
        # the first time:
        #   charly secrets get charly/secret WEBUI_ADMIN_PASSWORD
        # To override with a specific value before deploying:
        #   charly secrets set charly/secret WEBUI_ADMIN_PASSWORD <password>
        secret_require:
            - name: WEBUI_ADMIN_PASSWORD
              description: "Initial admin account password for Open WebUI first-run setup. Auto-generated on first deploy; retrieve via `charly secrets get charly/secret WEBUI_ADMIN_PASSWORD`."
        secret_accept:
            - name: OPENROUTER_API_KEY
              description: "API key for OpenRouter (maps to OPENAI_API_KEY with OpenRouter base URL)"
              key: charly/api-key/openrouter
            - name: OLLAMA_API_KEY
              description: "API key for Ollama Cloud inference"
              key: charly/api-key/ollama
            - name: OPENAI_API_KEY
              description: "Direct OpenAI API key (alone it is enough — the base URL defaults to https://api.openai.com/v1)"
              key: charly/api-key/openai

        mcp_accept:
            - name: jupyter
              description: "JupyterLab CRDT MCP server for notebook manipulation"
            - name: chrome-devtools
              description: "Chrome DevTools MCP server for browser automation"
        port:
            - 8080
        volume:
            - name: data
              path: "/opt/data"
        alias:
            - name: open-webui
              command: open-webui
        secret:
            - name: webui-secret-key
              env: WEBUI_SECRET_KEY
        service:
            - name: openwebui
              exec: "%(ENV_HOME)s/.local/bin/openwebui-entrypoint"
              restart: always
              working_directory: "%(ENV_HOME)s"
              enable: true
              scope: system
        plan:
            - run: mkdir=${HOME}/.local/bin
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: copy=openwebui-entrypoint
              copy: openwebui-entrypoint
              to: "${HOME}/.local/bin/openwebui-entrypoint"
              mode: "0755"
              run_as: "${USER}"
            - check: the auto-config entrypoint script is present and executable at ${HOME}/.local/bin/openwebui-entrypoint
              file:
                file: ${HOME}/.local/bin/openwebui-entrypoint
                exists: true
                mode: "0755"
            - check: the openwebui service is running under the init system
              context:
                - runtime
              service:
                service: openwebui
                running: true
            - check: the Open WebUI web interface answers HTTP 200 on the published port
              timeout: 30s
              # First start is not quick: Open WebUI runs its Alembic migrations and
              # builds the model cache before uvicorn binds, so a single unconditional
              # GET on a fresh deployment hits the port forwarder with nothing behind it
              # and gets a connection reset (measured: the whole live phase failed on
              # this step at ~8s into a cold bed). `eventually` probes readiness in the
              # engine — a bounded retry, never a fixed sleep — for the app's real
              # cold-start budget; steady state is still asserted by the same single
              # request once it is up.
              eventually: 3m
              retry_interval: 2s
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:8080}/
                status: 200
            # The entrypoint's provider projection has no other committed witness, so it is
            # asserted HERE as a BUILD-scope check: the stub `open-webui` below stands in for
            # the real service and captures what the entrypoint WOULD exec, which is the
            # projection under test. Build scope is deliberate — `check live` resolves the
            # PUBLISHED candy, so a runtime-scoped step here would be skipped in both phases;
            # `check image` runs the candy this tree actually built, and fails without the
            # key-alone fix (measured: the same input produced no provider before it — at
            # build time there is no OPENAI_API_KEY in the environment at all, so the key is
            # SET explicitly in case A and explicitly ABSENT in case C).
            - check: the entrypoint configures a provider from OPENAI_API_KEY alone, defaulting the base URL to the upstream endpoint — the declared secret must work without a second variable
              id: entrypoint-openai-key-alone
              exit_status: 0
              stdout:
                - contains: "OpenAI-compatible at https://api.openai.com/v1"
                - contains: "PROJECTED=https://api.openai.com/v1"
              command: |
                mkdir -p /tmp/ep-stub
                printf '#!/bin/sh\nif [ -z "$OPENAI_API_BASE_URLS" ]; then echo "PROJECTED=none"; else echo "PROJECTED=$OPENAI_API_BASE_URLS"; fi\n' > /tmp/ep-stub/open-webui
                chmod 0755 /tmp/ep-stub/open-webui
                env -u OPENAI_API_BASE_URL -u OPENROUTER_API_KEY -u OLLAMA_API_KEY -u OLLAMA_HOST -u CHARLY_MCP_SERVERS -u CODE_EXECUTION_JUPYTER_AUTH_TOKEN OPENAI_API_KEY=probe-key PATH=/tmp/ep-stub:/usr/local/bin:/usr/bin:/bin DATA_DIR=/tmp/ep-data WEBUI_ADMIN_EMAIL=probe@example.com WEBUI_ADMIN_PASSWORD=probe ~/.local/bin/openwebui-entrypoint
            - check: with no provider variables set the entrypoint invents no provider
              id: entrypoint-openai-absent
              exit_status: 0
              stdout:
                - contains: "PROJECTED=none"
              command: |
                mkdir -p /tmp/ep-stub
                printf '#!/bin/sh\nif [ -z "$OPENAI_API_BASE_URLS" ]; then echo "PROJECTED=none"; else echo "PROJECTED=$OPENAI_API_BASE_URLS"; fi\n' > /tmp/ep-stub/open-webui
                chmod 0755 /tmp/ep-stub/open-webui
                env -u OPENAI_API_KEY -u OPENAI_API_BASE_URL -u OPENROUTER_API_KEY -u OLLAMA_API_KEY -u OLLAMA_HOST -u CHARLY_MCP_SERVERS -u CODE_EXECUTION_JUPYTER_AUTH_TOKEN PATH=/tmp/ep-stub:/usr/local/bin:/usr/bin:/bin DATA_DIR=/tmp/ep-data WEBUI_ADMIN_EMAIL=probe@example.com WEBUI_ADMIN_PASSWORD=probe ~/.local/bin/openwebui-entrypoint
            - check: the mandatory admin email is injected into the running service environment
              exit_status: 0
              context:
                - runtime
              command: printenv WEBUI_ADMIN_EMAIL
            - agent-check: the rendered landing page presents the Open WebUI sign-in experience for the auto-provisioned admin account, ready to start an LLM chat
            - check: addr=127.0.0.1:${HOST_PORT:8080}
              id: openwebui-port
              timeout: 5s
              context:
                - runtime
              addr:
                addr: 127.0.0.1:${HOST_PORT:8080}
                reachable: true

openwebui-skill:
    skill:
        name: openwebui
        family: openwebui
        owner: openwebui
        description: |-
            Open WebUI box with auto-configured LLM providers, MCP servers, and Jupyter on port 8080.
            MUST be invoked before building, deploying, configuring, or troubleshooting the openwebui box.

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
openwebui-layer-skill:
    skill:
        name: openwebui-layer
        family: openwebui
        owner: openwebui
