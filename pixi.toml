[workspace]
name = "openwebui"
channels = ["conda-forge"]
platforms = ["linux-64"]

# The glibc platform the builder resolves (it appends this section when absent).
# Declaring it here makes the builder's append a no-op and keys pixi.lock to
# `linux-64-glibc-2-39`, so `pixi install --frozen` matches on pixi 0.84.2.
[system-requirements]
libc = { family = "glibc", version = "2.39" }

[dependencies]
python = ">=3.11,<3.13"

[pypi-dependencies]
open-webui = "==0.13.4"
# Upstream declares qdrant-client ONLY under the `all` extra, so the base package
# leaves VECTOR_DB=qdrant without its connector import — the factory builds the client
# while routers/retrieval is imported, so the app would not boot at all.
# Pin the upstream-tested version explicitly (NOT open-webui[all], which drags in
# playwright/colbert/oracledb/azure-search/weaviate/pinecone as well).
qdrant-client = "==1.18.0"
